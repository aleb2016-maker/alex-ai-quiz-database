<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu demo quiz</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f5f8;
      color: #172033;
    }

    header {
      padding: 36px 18px;
      text-align: center;
      background: linear-gradient(135deg, #12213f, #254a8b);
      color: white;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 16px 60px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: white;
      border-radius: 24px;
      padding: 26px;
      box-shadow: 0 10px 30px rgba(20, 30, 55, 0.1);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 36px rgba(20, 30, 55, 0.14);
    }

    .card h2 {
      margin: 0 0 10px;
      color: #1b66d2;
    }

    .card p {
      margin: 0 0 18px;
      color: #566177;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      background: #1b66d2;
      color: white;
      font-weight: 800;
      border-radius: 999px;
      padding: 11px 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Demo Quiz</h1>
    <p>Le sezioni sono ora separate: Quiz AI e Scienze hanno pagine e contatori indipendenti.</p>
  </header>

  <main>
    <div class="grid">
      <a class="card" href="../demo-ai/index.html">
        <h2>Demo Quiz AI</h2>
        <p>AI, Informatica, Matematica, Inglese, Logica testuale e Logica visiva.</p>
        <span class="button">Apri Quiz AI</span>
      </a>

      <a class="card" href="../demo-scienze/index.html">
        <h2>Demo Scienze</h2>
        <p>Scienze generali, Biologia, Chimica, Fisica e Fisica quantistica.</p>
        <span class="button">Apri Scienze</span>
      </a>
    </div>
  </main>
</body>
</html>
