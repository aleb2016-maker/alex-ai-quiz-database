name: Crea e scarica pacchetto quiz

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Che tipo di pacchetto vuoi creare?"
        required: true
        default: "web"
        type: choice
        options:
          - android
          - web
          - demo
      subject:
        description: "Materia del test"
        required: true
        default: "scienze"
        type: choice
        options:
          - tutte
          - scienze
          - fisica
          - chimica
          - biologia
          - astronomia
          - scienze_della_terra
          - fisica_quantistica_base
          - ai
          - informatica
          - matematica
          - inglese
          - logica
          - logica_visiva
      level:
        description: "Livello delle domande"
        required: true
        default: "tutti"
        type: choice
        options:
          - tutti
          - facile
          - intermedio
          - avanzato
      number:
        description: "Numero domande"
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "20"
          - "all"

jobs:
  create-package:
    name: Genera pacchetto scaricabile
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Genera pacchetto quiz
        run: |
          python scripts/create_quiz_package.py \
            --platform "${{ github.event.inputs.platform }}" \
            --subject "${{ github.event.inputs.subject }}" \
            --level "${{ github.event.inputs.level }}" \
            --number "${{ github.event.inputs.number }}"

      - name: Carica pacchetto scaricabile
        id: upload_package
        uses: actions/upload-artifact@v4
        with:
          name: pacchetto-quiz-${{ github.event.inputs.platform }}-${{ github.event.inputs.subject }}
          path: dist/generated/*.zip

      - name: Mostra pulsante download chiaro
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # ✅ Pacchetto quiz pronto

          Il pacchetto è stato creato correttamente.

          ## ⬇️ Download

          [**SCARICA IL PACCHETTO QUIZ**](${{ steps.upload_package.outputs.artifact-url }})

          ---

          ## Cosa hai generato

          - Piattaforma: **${{ github.event.inputs.platform }}**
          - Materia: **${{ github.event.inputs.subject }}**
          - Livello: **${{ github.event.inputs.level }}**
          - Numero domande: **${{ github.event.inputs.number }}**

          ## Come usarlo

          ### Android
          Apri lo ZIP e copia il file:

          app/src/main/assets/database_quiz.json

          dentro il tuo progetto Android Studio.

          ### Web / Demo
          Apri il pacchetto web e usa:

          index.html  
          database_quiz.json

          EOF
