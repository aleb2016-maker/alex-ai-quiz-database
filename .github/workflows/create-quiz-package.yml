name: Crea e scarica pacchetto quiz

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Piattaforma del pacchetto"
        required: true
        default: "web"
        type: choice
        options:
          - web
          - android
          - demo

      subject:
        description: "Materia del quiz"
        required: true
        default: "scienze"
        type: choice
        options:
          - ai
          - informatica
          - matematica
          - inglese
          - logica
          - scienze
          - fisica
          - chimica
          - biologia
          - fisica_quantistica

      level:
        description: "Livello delle domande"
        required: true
        default: "tutti"
        type: choice
        options:
          - tutti
          - facile
          - intermedio
          - avanzato

      number:
        description: "Numero di domande"
        required: true
        default: "10"
        type: string

jobs:
  build:
    name: Genera pacchetto scaricabile
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Genera pacchetto quiz
        run: |
          python scripts/create_quiz_package.py \
            --platform "${{ inputs.platform }}" \
            --subject "${{ inputs.subject }}" \
            --level "${{ inputs.level }}" \
            --number "${{ inputs.number }}"

      - name: Rende chiari i nomi dei file nel pacchetto
        run: |
          python scripts/clean_package_outputs.py dist/generated

      - name: Mostra pacchetti generati
        run: |
          echo "Pacchetti ZIP generati:"
          find dist/generated -name "*.zip" -print

      - name: Carica pacchetto scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: pacchetto-quiz-${{ inputs.platform }}-${{ inputs.subject }}-${{ inputs.level }}-${{ inputs.number }}-domande
          path: dist/generated/*.zip
          if-no-files-found: error
          retention-days: 7
