<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Card Documento - Sport e Allenamenti</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.25), transparent 34%),
        radial-gradient(circle at top right, rgba(147, 51, 234, 0.25), transparent 34%),
        linear-gradient(135deg, #020617, #0f172a 45%, #111827);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 70px;
    }

    .hero {
      padding: 32px;
      border-radius: 30px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      margin-bottom: 28px;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 5vw, 58px);
      line-height: 1.02;
      font-weight: 950;
    }

    .hero p {
      margin: 0;
      color: #cbd5e1;
      font-weight: 800;
      font-size: 18px;
      line-height: 1.5;
    }

    .panel {
      padding: 28px;
      border-radius: 30px;
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    label {
      display: block;
      font-size: 28px;
      font-weight: 950;
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      min-height: 320px;
      resize: vertical;
      padding: 18px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: #3b3b3b;
      color: #f8fafc;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.45;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 24px;
    }

    button {
      border: 0;
      min-height: 72px;
      border-radius: 999px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 950;
      cursor: pointer;
      background: linear-gradient(135deg, #be123c, #9333ea);
      box-shadow: 0 16px 34px rgba(124, 58, 237, 0.34);
    }

    button.blue {
      background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
    }

    .status {
      display: inline-block;
      margin-top: 22px;
      padding: 10px 15px;
      border-radius: 999px;
      color: #dbeafe;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.35);
      font-weight: 900;
    }

    #output {
      margin-top: 30px;
    }

    .output-card {
      padding: 30px;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(15,23,42,0.98), rgba(88,28,135,0.92));
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    .output-card h2 {
      margin: 10px 0 18px;
      font-size: 34px;
      font-weight: 950;
    }

    .output-card h3 {
      margin-top: 22px;
      font-size: 22px;
      font-weight: 950;
    }

    .output-card p,
    .output-card li {
      font-weight: 800;
      line-height: 1.55;
      font-size: 18px;
    }

    .pill,
    .badge {
      display: inline-block;
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.17);
      font-weight: 950;
      color: #f8fafc;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 18px;
      margin-top: 24px;
    }

    .sport-card {
      min-height: 305px;
      border-radius: 26px;
      padding: 22px;
      background:
        radial-gradient(circle at top left, rgba(34,211,238,0.25), transparent 35%),
        linear-gradient(135deg, rgba(30,41,59,0.98), rgba(88,28,135,0.92));
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.30);
    }

    .icon {
      font-size: 58px;
      margin-bottom: 14px;
    }

    .sport-card h3 {
      margin: 14px 0 10px;
      font-size: 23px;
      font-weight: 950;
    }

    .duration {
      color: #bae6fd;
      font-weight: 950;
      margin-bottom: 10px;
    }

    .originale,
    .answer {
      margin-top: 14px;
      padding: 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.10);
      color: #dbeafe;
      font-weight: 800;
    }

    .question-box {
      margin: 18px 0;
      padding: 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 760px) {
      .buttons {
        grid-template-columns: 1fr;
      }

      textarea {
        font-size: 17px;
      }
    }
  </style>
  <script src="./rag-input-reale-guard.js"></script>
</head>

<body>
  <main>
    <section class="hero">
      <h1>Test Card Documento</h1>
      <p>
        Pagina di test pulita per trasformare schede sport, allenamenti e documenti brevi
        in riassunti, card visive, test e domande di studio.
      </p>
    </section>

    <section class="panel">
      <label for="documentoInput">Incolla testo documento</label>

      <textarea id="documentoInput" spellcheck="false">25 minuti di camminata
,bicicletta
o nuoto
5 minuti di esercizio di riscaldamen
to
Riposo
30 minuti di camminat
bicicletta

5 minuti di esercizio di riscaldame
nto
Riposo
Riposo
10 minuti di flessibilità
10 minuti di esercizio di equilibrio
5 minuti di defaticamen
to e 5 di relax</textarea>

      <input id="fileInput" type="file" accept=".txt,.pdf" hidden>

      <div class="buttons">
        <button id="btnFile" class="blue" type="button">Carica file PDF / TXT</button>
        <button id="btnRiassunto" type="button">Genera riassunto</button>
        <button id="btnCard" type="button">Genera card</button>
        <button id="btnTest" type="button">Genera test</button>
        <button id="btnStudio" type="button">Genera domande studio</button>
      </div>

      <div class="status">
        Motore sport collegato direttamente ai 4 bottoni - versione pulita
      </div>

      <div id="output"></div>
    </section>
  </main>

  <script src="sport-training-document-engine.js?v=motore-universale-distrattori-2"></script>
</body>
</html>
