<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Test Scarica PDF browser V6</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:system-ui,Arial,sans-serif;margin:0;background:#0f172a;color:#fff}
    main{max-width:1100px;margin:0 auto;padding:24px}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
    button{border:0;border-radius:14px;padding:14px 18px;font-weight:800;cursor:pointer}
    .gen{background:#14b8a6;color:#06202d}.pdf{background:#b91c1c;color:white}
    .section-title{font-size:28px;margin:28px 0 14px}
    .cards-grid{display:grid;gap:18px}
    .training-card{aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:#071426;border:2px solid #22d3ee;box-shadow:0 18px 60px rgba(0,0,0,.35);position:relative;padding:34px}
    .training-card h2{font-size:48px;line-height:.95;margin:0 0 12px;text-transform:uppercase}
    .training-card h2 span{color:#19d5c2;display:block}.badge{display:inline-block;background:#19d5c2;color:#06151f;font-weight:900;padding:8px 18px;border-radius:12px;margin-bottom:24px}
    .box{position:absolute;right:34px;bottom:34px;width:45%;background:rgba(255,255,255,.08);border:1px solid #67e8f9;border-radius:18px;padding:18px}
    .photo{position:absolute;left:34px;bottom:34px;width:34%;height:42%;border-radius:22px;background:linear-gradient(135deg,#0f766e,#111827);display:grid;place-items:center;font-size:54px}
    .num{position:absolute;right:28px;top:28px;background:#d9f99d;color:#06151f;border-radius:10px;padding:8px 14px;font-weight:900}
    .summary-card,.study-card,.test-card{background:white;color:#111;border-radius:32px;padding:34px;box-shadow:0 14px 40px rgba(0,0,0,.24);overflow:hidden}
    .pill{display:inline-block;background:#e2e8f0;color:#0f172a;border-radius:999px;padding:6px 12px;font-weight:700}
  </style>
</head>
<body>
<main>
  <h1>Test PDF browser-only V6</h1>
  <p>La V6 cattura il riquadro e lo inserisce in una pagina PDF scura con clipping arrotondato, senza tagliare testi.</p>
  <div class="actions">
    <button class="gen" onclick="generaDemo()">Genera demo</button>
    <button class="pdf">Scarica PDF</button>
  </div>
  <h2 class="section-title">Card</h2>
  <section id="cards" class="cards-grid" data-export-section="cards"></section>
  <h2 class="section-title">Riassunti</h2>
  <section id="riassunti" data-export-section="summary"></section>
  <h2 class="section-title">Domande studio</h2>
  <section id="domande-studio" data-export-section="study"></section>
  <h2 class="section-title">Test</h2>
  <section id="test" data-export-section="test"></section>
</main>
<script>
function generaDemo(){
  const cards = [
    ['Riscaldamento','efficace','🏃','5-10 minuti di attivazione progressiva'],
    ['Tecnica','corretta','🏋️','Controllo del movimento e postura'],
    ['Recupero','ottimale','💧','Pause corrette e idratazione']
  ];
  document.querySelector('#cards').innerHTML = cards.map((c,i)=>`
    <article class="training-card" data-pdf-card>
      <div class="badge">SPORT</div>
      <div class="num">${i+1} / ${cards.length}</div>
      <h2>${c[0]}<span>${c[1]}</span></h2>
      <p>Card generata nella demo e pronta per il PDF.</p>
      <div class="photo">${c[2]}</div>
      <div class="box"><strong>PUNTI CHIAVE</strong><p>${c[3]}</p><p>PDF creato direttamente nel browser.</p></div>
    </article>`).join('');
  document.querySelector('#riassunti').innerHTML = `<article class="summary-card" data-pdf-summary><span class="pill">Riassunto 1</span><h3>Principi base dell'allenamento</h3><p>Un programma efficace parte da riscaldamento, esecuzione tecnica, progressione del carico e recupero coerente.</p></article>`;
  document.querySelector('#domande-studio').innerHTML = `<article class="study-card" data-pdf-study><span class="pill">Domande studio</span><h3>Ripasso rapido</h3><ol><li>Perché il riscaldamento è importante?</li><li>Come si controlla la progressione del carico?</li><li>Perché il recupero migliora la prestazione?</li></ol></article>`;
  document.querySelector('#test').innerHTML = `<article class="test-card" data-pdf-test><span class="pill">Test</span><h3>Quiz finale</h3><p><strong>Qual è lo scopo principale del riscaldamento?</strong></p><ul><li>A. Affaticare i muscoli prima del lavoro</li><li>B. Preparare corpo e articolazioni al carico</li><li>C. Ridurre il recupero post allenamento</li><li>D. Sostituire la parte tecnica</li></ul></article>`;
}
</script>
<script src="./pdf-export-browser-v6.js?v=6"></script>
</body>
</html>
