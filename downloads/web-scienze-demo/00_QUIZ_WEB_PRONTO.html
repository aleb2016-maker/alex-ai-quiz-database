<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Apri quiz generato</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top left, #155e75, #020617 45%, #111827);
      color: #f8fafc;
    }
    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 36px 20px;
    }
    .hero, .quiz {
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.32);
      border-radius: 28px;
      padding: 30px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.35);
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3.3rem);
      margin: 0 0 12px;
    }
    p {
      color: #cbd5e1;
      line-height: 1.6;
    }
    .start {
      margin-top: 20px;
      padding: 18px 28px;
      border: 0;
      border-radius: 20px;
      background: linear-gradient(135deg, #5eead4, #f0f9a8);
      color: #020617;
      font-size: 1.08rem;
      font-weight: 1000;
      cursor: pointer;
    }
    .quiz {
      margin-top: 28px;
      display: none;
    }
    .top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      color: #cbd5e1;
      font-weight: 800;
      margin-bottom: 18px;
    }
    .score {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.16);
      color: #bbf7d0;
      white-space: nowrap;
    }
    .question {
      font-size: 1.35rem;
      font-weight: 950;
      line-height: 1.45;
      margin-bottom: 20px;
    }
    .option {
      width: 100%;
      margin: 8px 0;
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(30, 41, 59, 0.96);
      color: #f8fafc;
      text-align: left;
      font-size: 1rem;
      font-weight: 750;
      cursor: pointer;
    }
    .correct { background: rgba(22, 163, 74, 0.9); }
    .wrong { background: rgba(220, 38, 38, 0.9); }
    .disabled { opacity: 0.5; }
    .feedback {
      margin-top: 20px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(2, 6, 23, 0.65);
      display: none;
    }
    .next {
      margin-top: 14px;
      padding: 14px 20px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, #5eead4, #f0f9a8);
      color: #020617;
      font-weight: 950;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>Prova subito il tuo test</h1>
      <p>
        Questo è il pacchetto web già pronto. Premi il pulsante e il quiz parte direttamente nel browser.
      </p>
      <button class="start" onclick="startQuiz()">▶ PROVA IL TEST ADESSO</button>
      <p>
        File inclusi: <strong>1_APRI_QUIZ.html</strong>, <strong>README_LEGGIMI.html</strong>, <strong>database_quiz.json</strong>.
      </p>
    </section>

    <section id="quizBox" class="quiz"></section>
  </main>

  <script>

ottocategoria": "fisica_base", "livello": "facile", "domanda": "Quale grandezza fisica si misura in Newton?", "opzioni": ["Energia", "Potenza", "Forza", "Pressione"], "risposta_corretta": "Forza", "spiegazione": "Il Newton è l'unità di misura della forza. L'energia si misura in joule, la potenza in watt e la pressione in pascal.", "tags": ["fisica_base", "scienze"], "difficolta": 1, "distrattore_forte": "Potenza", "punteggio_distrattore_forte": 1.0, "motivo_distrattore_forte": "È un distrattore plausibile perché è collegato allo stesso argomento della risposta corretta, ma non identifica precisamente il concetto richiesto. La risposta corretta resta 'Forza', non 'Potenza'.", "qualita": 100}, {"id": "SCI_011", "categoria": "scienze", "sottocategoria": "fisica_base", "livello": "avanzato", "domanda": "Quale affermazione descrive meglio la differenza tra massa e peso?", "opzioni": ["La massa dipende dalla gravità, il peso no", "La massa è la quantità di materia, il peso è la forza gravitazionale su quella massa", "Massa e peso sono sempre la stessa grandezza", "Il peso si misura in chilogrammi, la massa in Newton"], "risposta_corretta": "La massa è la quantità di materia, il peso è la forza gravitazionale su quella massa", "spiegazione": "La massa indica quanta materia contiene un corpo e si misura in chilogrammi. Il peso è una forza dovuta alla gravità e si misura in Newton.", "tags": ["fisica_base", "scienze"], "difficolta": 3, "distrattore_forte": "La massa dipende dalla gravità, il peso no", "punteggio_distrattore_forte": 0.94, "motivo_distrattore_forte": "È un distrattore plausibile perché è collegato allo stesso argomento della risposta corretta, ma non identifica precisamente il concetto richiesto. La risposta corretta resta 'La massa è la quantità di materia, il peso è la forza gravitazionale su quella massa', non 'La massa dipende dalla gravità, il peso no'.", "qualita": 100}, {"id": "SCI_004", "categoria": "scienze", "sottocategoria": "scienze_della_terra", "livello": "intermedio", "domanda": "Quale strato della Terra si trova subito sotto la crosta terrestre?", "opzioni": ["Mantello", "Nucleo esterno", "Nucleo interno", "Litosfera esterna"], "risposta_corretta": "Mantello", "spiegazione": "Sotto la crosta terrestre si trova il mantello. Il nucleo esterno e il nucleo interno sono più profondi.", "tags": ["scienze_della_terra", "scienze"], "difficolta": 2, "distrattore_forte": "Litosfera esterna", "punteggio_distrattore_forte": 0.59, "motivo_distrattore_forte": "È un distrattore plausibile perché è collegato allo stesso argomento della risposta corretta, ma non identifica precisamente il concetto richiesto. La risposta corretta resta 'Mantello', non 'Litosfera esterna'.", "qualita": 100}, {"id": "SCI_037", "categoria": "scienze", "sottocategoria": "scienze_della_terra", "livello": "avanzato", "domanda": "Perché le onde sismiche S non attraversano il nucleo esterno terrestre?", "opzioni": ["Perché le onde S non si propagano nei liquidi e il nucleo esterno è liquido", "Perché le onde S si propagano solo nel vuoto assoluto", "Perché il nucleo esterno non contiene materia", "Perché le onde S sono onde luminose e non onde meccaniche"], "risposta_corretta": "Perché le onde S non si propagano nei liquidi e il nucleo esterno è liquido", "spiegazione": "Le onde S sono onde di taglio e non possono propagarsi nei liquidi. Questo aiuta a dedurre che il nucleo esterno terrestre è liquido.", "tags": ["onde sismiche", "nucleo terrestre", "geologia"], "difficolta": 3, "distrattore_forte": "Perché le onde S si propagano solo nel vuoto assoluto", "punteggio_distrattore_forte": 0.55, "motivo_distrattore_forte": "È un distrattore plausibile perché è collegato allo stesso argomento della risposta corretta, ma non identifica precisamente il concetto richiesto. La risposta corretta resta 'Perché le onde S non si propagano nei liquidi e il nucleo esterno è liquido', non 'Perché le onde S si propagano solo nel vuoto assoluto'.", "qualita": 100}, {"id": "SCI_040", "categoria": "scienze", "sottocategoria": "fisica_base", "livello": "avanzato", "domanda": "Qual è la differenza corretta tra massa e peso?", "opzioni": ["La massa misura la quantità di materia, il peso è una forza dovuta alla gravità", "La massa e il peso sono sempre la stessa grandezza fisica", "Il peso misura la quantità di materia, la massa misura la temperatura", "La massa cambia sempre più del peso quando un corpo si sposta sulla Luna"], "risposta_corretta": "La massa misura la quantità di materia, il peso è una forza dovuta alla gravità", "spiegazione": "La massa è legata alla quantità di materia. Il peso è una forza e dipende dal campo gravitazionale.", "tags": ["massa", "peso", "gravità"], "difficolta": 3, "distrattore_forte": "La massa e il peso sono sempre la stessa grandezza fisica", "punteggio_distrattore_forte": 1.0, "motivo_distrattore_forte": "È un distrattore plausibile perché è collegato allo stesso argomento della risposta corretta, ma non identifica precisamente il concetto richiesto. La risposta corretta resta 'La massa misura la quantità di materia, il peso è una forza dovuta alla gravità', non 'La massa e il peso sono sempre la stessa grandezza fisica'.", "qualita": 100}];
    let quiz = [];
    let indice = 0;
    let punteggio = 0;
    let bloccato = false;

    function startQuiz() {
      quiz = [...quizDatabase];
      indice = 0;
      punteggio = 0;
      mescola(quiz);
      document.getElementById("quizBox").style.display = "block";
      mostraDomanda();
      document.getElementById("quizBox").scrollIntoView({ behavior: "smooth" });
    }

    function mostraDomanda() {
      bloccato = false;
      const box = document.getElementById("quizBox");
      const domanda = quiz[indice];

      if (!domanda) {
        const percentuale = Math.round((punteggio / quiz.length) * 100);
        box.innerHTML = `
          <h2>Risultato finale</h2>
          <p>Hai risposto correttamente a <strong>${punteggio}</strong> domande su <strong>${quiz.length}</strong>.</p>
          <p>Percentuale: <strong>${percentuale}%</strong></p>
          <button class="next" onclick="startQuiz()">Rifai il test</button>
        `;
        return;
      }

      box.innerHTML = `
        <div class="top">
          <div>Domanda ${indice + 1}/${quiz.length} · ${escapeHtml(domanda.categoria)} · ${escapeHtml(domanda.livello)}</div>
          <div class="score">Punteggio: ${punteggio}</div>
        </div>
        <div class="question">${escapeHtml(domanda.domanda)}</div>
        <div>
          ${(domanda.opzioni || []).map((opzione, i) => `
            <button class="option" data-index="${i}">
              <strong>${String.fromCharCode(65 + i)})</strong> ${escapeHtml(opzione)}
            </button>
          `).join("")}
        </div>
        <div id="feedback" class="feedback"></div>
      `;

      document.querySelectorAll(".option").forEach(button => {
        button.addEventListener("click", () => {
          rispondi(Number(button.dataset.index));
        });
      });
    }

    function rispondi(indiceRisposta) {
      if (bloccato) return;
      bloccato = true;

      const domanda = quiz[indice];
      const risposta = domanda.opzioni[indiceRisposta];
      const corretta = risposta === domanda.risposta_corretta;

      if (corretta) punteggio++;

      document.querySelectorAll(".option").forEach((button, i) => {
        const valore = domanda.opzioni[i];

        if (valore === domanda.risposta_corretta) {
          button.classList.add("correct");
        } else if (i === indiceRisposta) {
          button.classList.add("wrong");
        } else {
          button.classList.add("disabled");
        }
      });

      const feedback = document.getElementById("feedback");
      feedback.style.display = "block";
      feedback.innerHTML = `
        <p><strong>${corretta ? "Corretto." : "Sbagliato."}</strong></p>
        <p>Risposta corretta: <strong>${escapeHtml(domanda.risposta_corretta)}</strong></p>
        <p>${escapeHtml(domanda.spiegazione || "Spiegazione non disponibile.")}</p>
        <button class="next" onclick="indice++; mostraDomanda()">
          ${indice === quiz.length - 1 ? "Vedi risultato finale" : "Domanda successiva"}
        </button>
      `;
    }

    function mescola(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
